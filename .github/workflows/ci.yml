# PlanIt CI. Runs on every pull request to main and on every push to main.
# Required status checks to set in branch protection (names are the job names):
#   backend / lint + tests, frontend / lint + build, security / dependency-audit,
#   security / secret-scan, pr-hygiene / size-check

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# NOTE: pull_request_target was removed on purpose. It runs with repo secrets and
# the base branch's code, which is both unsafe and means the PR was never tested.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend / lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find app folder
        run: |
          if [ -d backend ]; then echo "APP_DIR=." >> "$GITHUB_ENV"
          elif [ -d planit-main/backend ]; then echo "APP_DIR=planit-main" >> "$GITHUB_ENV"
          else echo "backend/ folder not found"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: ${{ env.APP_DIR }}/backend
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      - name: Syntax check every backend file
        working-directory: ${{ env.APP_DIR }}/backend
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: ESLint (errors fail, warnings do not)
        working-directory: ${{ env.APP_DIR }}/backend
        run: npx --yes eslint@8 . --ext .js --quiet
      - name: Payments self-test (no database or network needed)
        working-directory: ${{ env.APP_DIR }}/backend
        run: node scripts/payments-selftest.js

  frontend:
    name: frontend / lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find app folder
        run: |
          if [ -d frontend ]; then echo "APP_DIR=." >> "$GITHUB_ENV"
          elif [ -d planit-main/frontend ]; then echo "APP_DIR=planit-main" >> "$GITHUB_ENV"
          else echo "frontend/ folder not found"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: ${{ env.APP_DIR }}/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      - name: ESLint (errors fail, warnings do not)
        working-directory: ${{ env.APP_DIR }}/frontend
        run: npx eslint . --ext js,jsx --quiet
      - name: Production build
        working-directory: ${{ env.APP_DIR }}/frontend
        run: npm run build

  dependency-audit:
    name: security / dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find app folder
        run: |
          if [ -d backend ]; then echo "APP_DIR=." >> "$GITHUB_ENV"; else echo "APP_DIR=planit-main" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit backend (production deps, high or critical fails)
        working-directory: ${{ env.APP_DIR }}/backend
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
          npm audit --omit=dev --audit-level=high
      - name: Audit frontend (production deps, high or critical fails)
        working-directory: ${{ env.APP_DIR }}/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
          npm audit --omit=dev --audit-level=high

  secret-scan:
    name: security / secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: PlanIt-specific credential patterns (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          FOUND=0
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- . ':(exclude)*.md' ':(exclude)*.example')
          echo "$DIFF" | grep -E "sk_live_[0-9a-zA-Z]{24,}" && { echo "Stripe LIVE key in diff"; FOUND=1; }
          echo "$DIFF" | grep -E "mongodb\+srv://[^@]+@[a-z0-9]+\.mongodb\.net" && { echo "MongoDB Atlas URI in diff"; FOUND=1; }
          echo "$DIFF" | grep -E "AX[A-Z0-9]{40,}" && { echo "Upstash token pattern in diff"; FOUND=1; }
          echo "$DIFF" | grep -E '"[0-9a-f]{64}"' && { echo "64-char hex (license key or integrity proof?) in diff"; FOUND=1; }
          [ "$FOUND" -eq 0 ] || { echo "Remove it and rotate any real credential."; exit 1; }
          echo "No credential patterns found."

  size-check:
    name: pr-hygiene / size-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR size
        run: |
          STAT=$(git diff --numstat origin/${{ github.base_ref }}...HEAD -- . ':(exclude)*package-lock.json' ':(exclude)*.lock' ':(exclude)docs/' | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "Lines changed: $STAT"
          if [ "$STAT" -gt 800 ]; then echo "Over 800 lines. Split this PR."; exit 1; fi
          if [ "$STAT" -gt 400 ]; then echo "Large PR (over 400 lines). Passing, but consider splitting."; fi
